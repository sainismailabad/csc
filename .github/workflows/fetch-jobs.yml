name: Auto Fetch Government Jobs

on:
  schedule:
    # Roz subah 6 AM IST (0:30 UTC)
    - cron: '30 0 * * *'
  
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual run'

jobs:
  fetch-jobs:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Verify files exist
        run: |
          echo "📁 Repository files:"
          ls -la
          echo ""
          echo "🔍 Checking required files..."
          test -f rss-feeds.json && echo "✅ rss-feeds.json found" || echo "❌ rss-feeds.json MISSING"
          test -f fetch-jobs.js && echo "✅ fetch-jobs.js found" || echo "❌ fetch-jobs.js MISSING"
          test -f package.json && echo "✅ package.json found" || echo "❌ package.json MISSING"
      
      - name: Install dependencies
        run: npm install
      
      - name: Fetch jobs from RSS feeds
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: node fetch-jobs.js
      
      - name: Summary
        if: always()
        run: |
          echo "### 📊 Job Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
